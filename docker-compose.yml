name: super-score

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: super-score-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - super-score

  nginx:
    image: nginx:stable-alpine
    container_name: super-score-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - super-score

  mysql:
    image: mysql:8
    container_name: super-score-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-super_score}
      MYSQL_USER: ${DB_USERNAME:-super_score}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - super-score-mysql-data:/var/lib/mysql
    networks:
      - super-score
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: super-score-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - super-score-redis-data:/data
    networks:
      - super-score

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: super-score-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - super-score

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: super-score-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8082:8080"
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    depends_on:
      - mysql
      - redis
    networks:
      - super-score

networks:
  super-score:
    driver: bridge

volumes:
  super-score-mysql-data:
  super-score-redis-data:
